<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA Meta -->
  <meta name="theme-color" content="#09090f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UnheaveN">
  <meta name="application-name" content="UnheaveN: ERA">
  <meta name="description" content="Companion app para UnheaveN: ERA — Palimpsest v2.9.0">

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Apple Touch Icon (falls back to SVG) -->
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">

  <title>UnheaveN: ERA — Palimpsest</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────── -->
<div id="header">
  <div class="logo">
    UnheaveN: ERA
    <span class="logo-sub">Palimpsest · Companion</span>
  </div>
  <div class="mode-toggle" id="mode-toggle" onclick="toggleMode()">
    <span class="mode-label" id="mode-label">MANUAL</span>
    <div class="mode-pip off" id="mode-pip"></div>
  </div>
</div>

<!-- ── UPDATE BANNER ───────────────────────────────────────────────── -->
<div id="update-banner">
  ↑ Nova versão disponível — toque para atualizar
</div>

<!-- ── CONTENT ─────────────────────────────────────────────────────── -->
<div id="app">
  <!-- Populated by app.js -->
  <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#5a5a70;font-family:'Rajdhani',sans-serif;font-size:13px;letter-spacing:0.1em">
    Carregando…
  </div>
</div>

<!-- ── TAB BAR ─────────────────────────────────────────────────────── -->
<nav id="tabbar">

  <button class="tab-btn active" id="tab-ficha" onclick="setTab('ficha')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <line x1="9" y1="7"  x2="15" y2="7"/>
      <line x1="9" y1="11" x2="15" y2="11"/>
      <line x1="9" y1="15" x2="13" y2="15"/>
    </svg>
    Ficha
  </button>

  <button class="tab-btn locked" id="tab-dados" onclick="setTab('dados')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z"/>
      <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
    </svg>
    Dados
  </button>

  <button class="tab-btn" id="tab-consulta" onclick="setTab('consulta')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="22" y2="22"/>
    </svg>
    Consulta
  </button>

  <button class="tab-btn" id="tab-hab" onclick="setTab('hab')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
    </svg>
    Hab.
  </button>

</nav>

<!-- ── TOAST ────────────────────────────────────────────────────────── -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- ── SCRIPTS ─────────────────────────────────────────────────────── -->
<script src="./data.js"></script>
<script src="./app.js"></script>

</body>
</html>
