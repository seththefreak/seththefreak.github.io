<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>UnheaveN: ERA - Companion</title>
  <meta name="description" content="Companion app para UnheaveN: ERA - Palimpsest v3.0.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ERA" />

  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="era-shared.js" data-presets="react"></script>
  <script type="text/babel" src="era-ficha.js" data-presets="react"></script>
  <script type="text/babel" src="era-rolls.js" data-presets="react"></script>
  <script type="text/babel" src="era-reference.js" data-presets="react"></script>
  <script type="text/babel" src="era-app.js" data-presets="react"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .then(function (reg) {
            console.log("[ERA] SW registrado:", reg.scope);
          })
          .catch(function (err) {
            console.warn("[ERA] SW falhou:", err);
          });
      });
    }
  </script>
</body>
