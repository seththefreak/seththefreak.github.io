<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unheaven Companion</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">

<style>
body { font-family: Arial; background:#0F1115; color:#E5E7EB; margin:0; }
header { padding:10px; background:#1A1D24; text-align:center; color:#22c55e; }

.tabs { display:flex; flex-wrap:wrap; gap:5px; padding:10px; }
button { cursor:pointer; border:none; border-radius:8px; padding:8px; background:#22c55e; }

.tab { background:#2A2F3A; }
.activeTab { background:#22c55e; color:black; }

.page { display:none; padding:10px; }
.show { display:block; }

.card { background:#1A1D24; padding:10px; border-radius:10px; margin-bottom:10px; }

input, select { margin:4px; padding:6px; border-radius:6px; border:none; }

.log { max-height:200px; overflow:auto; background:#2A2F3A; padding:5px; }

.turnActive { border:2px solid #22c55e; }
</style>
</head>
<body>

<header>UNHEAVEN COMPANION</header>

<div class="tabs">
<button class="tab activeTab" onclick="openTab('sheet',this)">Ficha</button>
<button class="tab" onclick="openTab('combat',this)">Combate</button>
<button class="tab" onclick="openTab('turns',this)">Turnos</button>
<button class="tab" onclick="openTab('logPage',this)">Log</button>
</div>

<!-- FICHA -->
<div id="sheet" class="page show">
<div class="card">
Nome <input id="nome"><br>

FOR <input id="for" type="number">
DEX <input id="dex" type="number">
CON <input id="con" type="number">
SAB <input id="sab" type="number"><br>

HP <input id="hp"> / <input id="hpmax">
<button onclick="hpChange(-5)">-5</button>
<button onclick="hpChange(5)">+5</button><br>

RD <input id="rd"><br>

<b>DT:</b> <span id="dt"></span>
<b>Iniciativa:</b> <span id="init"></span>
</div>
</div>

<!-- COMBATE -->
<div id="combat" class="page">
<div class="card">
Ataque <input id="atk">
Defesa <input id="def">
RD <input id="rdEnemy">

<button onclick="fight()">Resolver</button>
<div id="combatResult"></div>
</div>
</div>

<!-- TURNOS -->
<div id="turns" class="page">
<div class="card">
Nome <input id="turnName">
<button onclick="addTurn()">Adicionar</button>
<div id="turnList"></div>
<button onclick="nextTurn()">Próximo</button>
</div>
</div>

<!-- LOG -->
<div id="logPage" class="page">
<div class="card">
<div class="log" id="globalLog"></div>
</div>
</div>

<script>

// ===== UI =====
function openTab(id,btn){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('activeTab'));
 document.getElementById(id).classList.add('show');
 btn.classList.add('activeTab');
}

// ===== LOG =====
function log(msg){
 globalLog.innerHTML += msg+"<br>";
}

// ===== CALC =====
function updateCalc(){
 dt.textContent = 10 + (+dex.value||0);
 init.textContent = (+dex.value||0)+(+sab.value||0);
}

[for,dex,sab].forEach(i=>i.oninput=updateCalc);

// ===== HP =====
function hpChange(v){
 hp.value = Math.max(0,+hp.value+v);
}

// ===== COMBATE =====
function rand(){ return Math.floor(Math.random()*6)+1 }

function fight(){
 let a=+atk.value,d=+def.value,rd=+rdEnemy.value;

 if(a>d){
  let dmg=Math.max(rand(),rand())-rd;
  dmg=Math.max(0,dmg);
  combatResult.innerHTML=`Acerto! ${dmg}`;
  log("Dano: "+dmg);
 } else {
  combatResult.innerHTML="Erro";
  log("Ataque falhou");
 }
}

// ===== TURNOS =====
let turns=[],current=0;

function addTurn(){
 turns.push(turnName.value);
 renderTurns();
}

function nextTurn(){
 current=(current+1)%turns.length;
 renderTurns();
}

function renderTurns(){
 turnList.innerHTML="";
 turns.forEach((t,i)=>{
  let d=document.createElement('div');
  d.textContent=t;
  if(i==current) d.classList.add('turnActive');
  turnList.appendChild(d);
 });
}

// ===== SERVICE WORKER + UPDATE =====
if ("serviceWorker" in navigator) {
 let newWorker;

 navigator.serviceWorker.register("sw.js").then(reg => {

  reg.onupdatefound = () => {
   newWorker = reg.installing;

   newWorker.onstatechange = () => {
    if (newWorker.state === "installed") {
     if (navigator.serviceWorker.controller) {
      showUpdateBanner();
     }
    }
   };
  };

 });
}

function showUpdateBanner(){
 const b=document.createElement("div");
 b.style="position:fixed;bottom:10px;left:10px;right:10px;background:#22c55e;color:black;padding:10px;border-radius:10px;text-align:center;";
 b.innerHTML=`Nova versão 🚀 <button onclick="updateApp()">Atualizar</button>`;
 document.body.appendChild(b);
}

function updateApp(){
 location.reload();
}

updateCalc();

</script>

</body>
</html>
