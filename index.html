<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>UnheaveN: ERA · Companion</title>
  <meta name="description" content="Companion app para UnheaveN: ERA — Palimpsest v2.9.0" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ERA" />

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="root"></div>

  <!-- React + ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone para transpilar JSX em runtime -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Dados do sistema (expõe window.ERA_DATA) -->
  <script src="data.js"></script>

  <!-- App principal (JSX transpilado em runtime) -->
  <script type="text/babel" src="app.js" data-presets="react"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) {
            console.log('[ERA] SW registrado:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[ERA] SW falhou:', err);
          });
      });
    }
  </script>

</body>
</html>
